name: Build & Release

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.24.x"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Test
        run: go test -tags webkit2_41 ./...

      - name: Build
        run: '"$(go env GOPATH)"/bin/wails build'

      - name: Package artifact
        run: tar czf huecipher-linux-amd64.tar.gz -C build/bin huecipher

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: huecipher-linux-amd64
          path: huecipher-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: huecipher-linux-amd64
          path: artifacts

      - name: Get commit info
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: cp artifacts/huecipher-linux-amd64.tar.gz .

      - name: Create latest release
        if: github.ref_name == 'master'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: latest
          name: Latest Release
          artifacts: "huecipher-linux-amd64.tar.gz"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          prerelease: false
          body: |
            Latest build from `master`

            Commit: ${{ github.sha }}
            Short SHA: ${{ steps.commit.outputs.short_sha }}
            Built on: ${{ github.event.head_commit.timestamp }}

      - name: Create branch pre-release
        if: github.ref_name != 'master'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: "Pre-release: ${{ github.ref_name }}"
          artifacts: "huecipher-linux-amd64.tar.gz"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          prerelease: true
          body: |
            Pre-release build from branch: `${{ github.ref_name }}`

            Commit: ${{ github.sha }}
            Short SHA: ${{ steps.commit.outputs.short_sha }}
            Built on: ${{ github.event.head_commit.timestamp }}
